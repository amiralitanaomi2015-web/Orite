<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <style>
        :root { --bg: #f0f2f5; --card: #fff; --text: #333; --primary: #5c67f2; --danger: #ff4757; }
        .dark-mode { --bg: #1a1a1a; --card: #2d2d2d; --text: #f0f0f5; }
        body { font-family: Tahoma, sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; transition: 0.3s; }
        .controls { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 20px; }
        .card { background: var(--card); width: 100%; max-width: 450px; padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); transition: 0.5s; }
        input, select, button { width: 100%; padding: 12px; margin: 5px 0; border: 1px solid #ccc; border-radius: 10px; box-sizing: border-box; }
        button { background: var(--primary); color: white; border: none; cursor: pointer; }
        .shake { animation: shake 0.5s infinite; color: var(--danger); }
        @keyframes shake { 0%, 100% {transform: rotate(0deg);} 25% {transform: rotate(-15deg);} 75% {transform: rotate(15deg);} }
        .task-item { background: #f9f9f9; padding: 10px; margin-top: 10px; border-right: 5px solid var(--primary); border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>

    <div class="controls">
        <button onclick="document.querySelector('.card').style.maxWidth='400px'">📱</button>
        <button onclick="document.querySelector('.card').style.maxWidth='600px'">💻</button>
        <button onclick="document.querySelector('.card').style.maxWidth='900px'">🖥️</button>
        <button onclick="document.querySelector('.card').style.maxWidth='1200px'">📺</button>
        <button onclick="document.body.classList.toggle('dark-mode')">🌙</button>
        <select id="lang" onchange="updateLang()">
            <option value="fa">فارسی</option> <option value="en">English</option>
            <option value="tr">Türkçe</option> <option value="ar">العربية</option>
        </select>
    </div>

    <div class="card">
        <div id="bell" style="font-size: 30px; text-align: center;">🔔</div>
        <h2 id="title">Orite System</h2>
        <select id="tz"></select>
        <div id="clock" style="text-align: center; font-weight: bold; margin: 10px 0;"></div>
        <input type="text" id="desc" placeholder="توضیحات برنامه...">
        <input type="datetime-local" id="time">
        <button id="btn" onclick="saveTask()">ثبت برنامه</button>
        <div id="list"></div>
    </div>

<script>
    let tasks = JSON.parse(localStorage.getItem('oriteTasks')) || [];
    let editIdx = -1; // برای نگهداری وضعیت ویرایش

    const dict = {
        fa: { title: "سیستم هوشمند Orite", desc: "توضیحات برنامه...", btn: "ثبت برنامه" },
        en: { title: "Orite AI System", desc: "Task description...", btn: "Save Task" },
        tr: { title: "Orite Akıllı Sistem", desc: "Görev açıklaması...", btn: "Görevi Kaydet" },
        ar: { title: "نظام Orite الذكي", desc: "وصف المهمة...", btn: "حفظ المهمة" }
    };

    function updateLang() {
        const l = document.getElementById('lang').value;
        document.getElementById('title').innerText = dict[l].title;
        document.getElementById('desc').placeholder = dict[l].desc;
        document.getElementById('btn').innerText = dict[l].btn;
        document.documentElement.dir = (l === 'fa' || l === 'ar') ? 'rtl' : 'ltr';
    }

    Intl.supportedValuesOf('timeZone').forEach(tz => {
        let opt = document.createElement('option'); opt.value = tz; opt.innerText = tz;
        document.getElementById('tz').appendChild(opt);
    });

    function saveTask() {
        let desc = document.getElementById('desc').value;
        let time = new Date(document.getElementById('time').value).getTime();
        if (!desc || !time) return alert("لطفا پر کنید");
        
        if (editIdx > -1) { tasks[editIdx] = {desc, time}; editIdx = -1; }
        else { tasks.push({desc, time}); }
        
        localStorage.setItem('oriteTasks', JSON.stringify(tasks));
        render();
    }

    function render() {
        let list = document.getElementById('list'); list.innerHTML = "";
        let now = new Date().getTime();
        tasks.forEach((t, i) => {
            if(now > (t.time + 5000)) document.getElementById('bell').classList.add('shake');
            list.innerHTML += `<div class="task-item">
                <div>${t.desc} <br> <small>${new Date(t.time).toLocaleString()}</small></div>
                <div>
                    <button onclick="edit(${i})" style="background:orange; width:auto; padding:5px;">✏️</button>
                    <button onclick="del(${i})" style="background:var(--danger); width:auto; padding:5px;">❌</button>
                </div>
            </div>`;
        });
    }

    function edit(i) {
        editIdx = i;
        document.getElementById('desc').value = tasks[i].desc;
        document.getElementById('time').value = new Date(tasks[i].time - (new Date().getTimezoneOffset()*60000)).toISOString().slice(0, 16);
    }

    function del(i) { tasks.splice(i, 1); localStorage.setItem('oriteTasks', JSON.stringify(tasks)); render(); }

    setInterval(() => {
        document.getElementById('clock').innerText = new Date().toLocaleTimeString("fa-IR", { timeZone: document.getElementById('tz').value });
        render();
    }, 1000);
</script>
<script src="orite-ai.js"></script><script src="orite-settings.js"></script><script src="orite-settings-panel.js"></script>
</body>
</html>
