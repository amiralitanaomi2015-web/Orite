<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <style>
        :root { --primary: #5c67f2; --danger: #ff4757; }
        body { font-family: Tahoma, sans-serif; background: #f0f2f5; display: flex; justify-content: center; padding: 20px; }
        
        .card { 
            background: white; width: 100%; max-width: 450px; padding: 25px; 
            border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
        }

        /* بخش تراز بندی دقیق */
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 15px; /* فاصله یکسان بین همه موارد */
            width: 100%;
        }

        input, select, button {
            width: 100%; 
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 14px;
            box-sizing: border-box; /* جلوگیری از بیرون زدگی */
        }

        button { background: var(--primary); color: white; border: none; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { opacity: 0.9; }

        #notification-bell { font-size: 40px; text-align: center; margin-bottom: 15px; transition: 0.3s; }
        .shake { animation: shake 0.5s infinite; color: var(--danger); }
        @keyframes shake { 0%, 100% {transform: rotate(0deg);} 25% {transform: rotate(-15deg);} 75% {transform: rotate(15deg);} }

        .task-item { 
            background: #f9f9f9; padding: 12px; margin-top: 10px; 
            border-right: 5px solid var(--primary); border-radius: 8px;
            display: flex; justify-content: space-between; align-items: center;
        }
    </style>
</head>
<body>

<div class="card">
    <div id="notification-bell">🔔</div>
    <h2 style="text-align: center; margin-bottom: 20px;">Orite AI System</h2>
    
    <!-- بخش ورودی‌ها کاملا تراز شده -->
    <div class="input-group">
        <select id="timezone-select"></select>
        <div id="clock" style="text-align: center; font-weight: bold; padding: 10px; background: #eee; border-radius: 8px;"></div>
        <input type="text" id="task-desc" placeholder="توضیحات برنامه...">
        <input type="datetime-local" id="task-time">
        <button onclick="saveTask()">ثبت / ویرایش برنامه</button>
    </div>
    
    <div id="task-list"></div>
</div>

<script>
    let tasks = JSON.parse(localStorage.getItem('oriteTasks')) || [];
    let editIndex = -1;

    const timezones = Intl.supportedValuesOf('timeZone');
    const select = document.getElementById('timezone-select');
    timezones.forEach(tz => select.innerHTML += `<option value="${tz}">${tz}</option>`);

    function saveTask() {
        const desc = document.getElementById('task-desc').value;
        const time = new Date(document.getElementById('task-time').value).getTime();
        if (!desc || !time) return alert("لطفاً فیلدها را پر کنید");

        if (editIndex > -1) { tasks[editIndex] = { desc, time }; editIndex = -1; }
        else { tasks.push({ desc, time }); }
        
        localStorage.setItem('oriteTasks', JSON.stringify(tasks));
        document.getElementById('task-desc').value = "";
        renderTasks();
    }

    function renderTasks() {
        const list = document.getElementById('task-list');
        list.innerHTML = "";
        let shouldShake = false;
        const now = new Date().getTime();

        tasks.forEach((t, i) => {
            if (now > (t.time + 5000)) shouldShake = true;
            list.innerHTML += `
                <div class="task-item">
                    <div><strong>${t.desc}</strong><br><small>${new Date(t.time).toLocaleString('fa-IR')}</small></div>
                    <div>
                        <button onclick="editTask(${i})" style="width: auto; background: orange;">✏️</button>
                        <button onclick="deleteTask(${i})" style="width: auto; background: var(--danger);">❌</button>
                    </div>
                </div>`;
        });
        document.getElementById('notification-bell').className = shouldShake ? "shake" : "";
    }

    function editTask(i) {
        editIndex = i;
        document.getElementById('task-desc').value = tasks[i].desc;
        document.getElementById('task-time').value = new Date(tasks[i].time - (new Date().getTimezoneOffset() * 60000)).toISOString().slice(0, 16);
    }

    function deleteTask(i) { tasks.splice(i, 1); localStorage.setItem('oriteTasks', JSON.stringify(tasks)); renderTasks(); }

    setInterval(() => {
        const tz = document.getElementById('timezone-select').value;
        document.getElementById('clock').innerText = new Date().toLocaleTimeString("fa-IR", { timeZone: tz });
        renderTasks();
    }, 1000);
</script>
</body>
</html>
